# Local development database.
#
#   uv run init-env               # does everything below, plus .env and a data check
#
# or, by hand:
#
#   docker compose pull
#   docker compose up -d
#
# Then point the app at mongodb://localhost:27017/?directConnection=true (as in .env.example).
#
# This is NOT the app: the app's own image is built from ./Dockerfile and runs against whatever
# MONGODB_URI it is given. This file only provides the database that .env points at.
#
# TODO(mongodb phase 5): the MongoDB dev snapshot image does not exist yet. Until undl-ingest
# publishes it (docs/mongodb_migration_plan.md, phase 5), this starts an EMPTY MongoDB, and
# `init-env` fails its data check with "These collections are empty". To develop against real
# data meanwhile, fill it yourself, e.g. with undl-ingest's scripts/copy_postgres_to_mongo.py.
# When the snapshot lands: swap the image below for it, make the healthcheck test for the data
# itself (`db.member_states.countDocuments() > 0`, the snapshot restores before it is queryable),
# and update IMAGE in app/dev/init_env.py. The data is then a snapshot, not a live mirror.
#
# To move to a newer snapshot: `uv run update-db`. Note that `pull` + `up -d` is NOT enough --
# the image restores its dump only into a *fresh* data directory, so recreating the container on
# a newer image serves the old volume unchanged: new image, old rows, healthy container. The
# volume has to go: `docker compose pull && docker compose down -v && docker compose up -d`.

services:
  # Not `db`/`policy-pulse-db`: those are the Postgres snapshot's, and reusing the service name
  # would make compose recreate that container as this one.
  mongo:
    # TODO(mongodb phase 5): the snapshot image; pin a dated tag of it to freeze your data.
    image: mongodb/mongodb-atlas-local:8.0.15
    container_name: policy-pulse-mongo
    restart: unless-stopped
    ports:
      # Loopback only -- never expose a database to the network. Override the host port if you
      # already have a MongoDB on 27017:
      #   POLICY_PULSE_DB_PORT=27018 docker compose up -d
      - "127.0.0.1:${POLICY_PULSE_DB_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      # The image's own readiness check. TODO(mongodb phase 5): check for the data itself, see
      # the header.
      test: ["CMD", "/usr/local/bin/runner", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mongodata:
