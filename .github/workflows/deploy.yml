name: Build and Deploy

on:
  push:
    branches:
      - main
      - stable
      # Temporary, until the move to AWS: the FastAPI/Vue version on MongoDB, served on the VM
      # under /experimental/. Builds `:api-mongodb` of both images, nothing else.
      - feature/api-mongodb

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC -> AWS role for the ECR push, no stored AWS keys

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ECR (AWS move): repo variables AWS_ROLE_ARN and AWS_REGION come from policy-pulse-infra/bootstrap.
      - name: Configure AWS credentials
        if: github.ref_name == 'feature/api-mongodb'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        if: github.ref_name == 'feature/api-mongodb'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=raw,value=stable,enable=${{ github.ref_name == 'stable' }}
            type=raw,value=api-mongodb,enable=${{ github.ref_name == 'feature/api-mongodb' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # One plain image, no index + attestation: ECR's untagged-image lifecycle rule would hit the image under the index.
          provenance: false
          # ECR gets only the immutable sha tag (task definitions pin it); the line is empty on other branches.
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.ecr.outputs.registry && format('{0}/policy-pulse:{1}', steps.ecr.outputs.registry, github.sha) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          no-cache: true

      - name: Extract metadata for the web image
        if: github.ref_name == 'feature/api-mongodb'
        id: web_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=raw,value=api-mongodb

      - name: Build and push the web image
        if: github.ref_name == 'feature/api-mongodb'
        uses: docker/build-push-action@v5
        with:
          context: web
          push: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}
          build-args: |
            WEB_BASE=/experimental/

  # The Vue app as static files on S3 behind CloudFront (AWS move). Skipped until the infra repo has
  # set the repo variables WEB_BUCKET and WEB_DISTRIBUTION_ID.
  web-to-s3:
    if: github.ref_name == 'feature/api-mongodb' && vars.WEB_BUCKET != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24 # same as web/Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm run build` type-checks (vue-tsc) before the Vite build; no WEB_BASE, CloudFront serves at /.
      - name: Build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Same cache rules as web/nginx.conf. Assets first and never deleted: a browser holding the old
      # index.html still loads the old hashed chunks.
      - name: Upload to S3
        env:
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
        run: |
          aws s3 sync dist/assets/ "s3://$WEB_BUCKET/assets/" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ "s3://$WEB_BUCKET/" --exclude "assets/*" --delete --cache-control "no-cache"

      - name: Invalidate index.html on CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.WEB_DISTRIBUTION_ID }} --paths /index.html
