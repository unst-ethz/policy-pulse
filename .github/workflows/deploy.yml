name: Build and Deploy

on:
  push:
    branches:
      - main
      - stable
      # Temporary, until the move to AWS: the FastAPI/Vue version on MongoDB, served on the VM
      # under /experimental/. Builds `:api-mongodb` of both images, nothing else.
      - feature/api-mongodb

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=raw,value=stable,enable=${{ github.ref_name == 'stable' }}
            type=raw,value=api-mongodb,enable=${{ github.ref_name == 'feature/api-mongodb' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          no-cache: true

      - name: Extract metadata for the web image
        if: github.ref_name == 'feature/api-mongodb'
        id: web_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=raw,value=api-mongodb

      - name: Build and push the web image
        if: github.ref_name == 'feature/api-mongodb'
        uses: docker/build-push-action@v5
        with:
          context: web
          push: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}
          build-args: |
            WEB_BASE=/experimental/
